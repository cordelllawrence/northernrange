name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore northernrange.sln

      - name: Build
        run: dotnet build northernrange.sln --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test northernrange.sln --no-build -c Release --logger "console;verbosity=normal"

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format northernrange.sln --verify-no-changes --no-restore
