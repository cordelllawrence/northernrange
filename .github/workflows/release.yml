name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: osx-arm64
            os: macos-latest
            archive: tar
          - rid: osx-x64
            os: macos-13
            archive: tar
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        run: tar -czf nr-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} nr

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/nr.exe -DestinationPath nr-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nr-${{ matrix.rid }}
          path: nr-${{ matrix.rid }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
